<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>idlehive - network status</title>
    <script src="/static/htmx.min.js"></script>
    <link rel="preconnect" href="https://rsms.me/">
    <link rel="stylesheet" href="https://rsms.me/inter/inter.css">
    <style>
        :root {
            font-family: Inter, sans-serif;
            font-feature-settings: "cv05";
            font-kerning: normal;
            font-variant-ligatures: common-ligatures contextual;
            font-variant-numeric: tabular-nums;
            font-weight: 400;
            hyphens: auto;
            tab-size: 2em;
        }

        body {
            background: gainsboro;
            color: dimgray;
            font-size: 0.8rem;
            max-width: 16rem;
            margin: 0;
            padding-top: 0.2rem;
            padding-left: 1rem;
        }

        h1 {
            font-size: 1rem;
            font-weight: 500;
        }

        ul {
            list-style: none;
            padding: 0;
            margin: 0.5rem 0;
        }

        li {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            padding: 0.4rem 0;
        }

        .dot {
            width: 0.55rem;
            height: 0.55rem;
            border-radius: 50%;
            display: inline-block;
            flex-shrink: 0;
        }

        .dot-green {
            background: darkolivegreen;
        }

        .dot-blue {
            background: darkslateblue;
        }

        .dot-red {
            background: orangered;
        }

        .node-name {
            min-width: 5rem;
        }

        .rtt {
            margin-left: auto;
            font-size: 0.7rem;
        }

        .stale-warning {
            color: darkgoldenrod;
        }

        .updated-at, .hint {
            font-size: 0.85em;
            margin-top: 1rem;
        }

        h1 a {
            color: darkslategray;
        }
    </style>
</head>
<body>
<h1>idlehive network status <a href="#" hx-post="/fragment/status/refresh" hx-target="#status-list"
                       hx-swap="outerHTML">refresh</a></h1>

{% include "_status_fragment.html" %}

<div hx-get="/fragment/status" hx-trigger="every 60s" hx-target="#status-list" hx-swap="outerHTML"
     style="display:none"></div>
</body>
</html>
